<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrillingCalc — Drilling Cost Estimator</title>
<style>
/* DrillingCalc styling — clean professional look, Moran Rocks navy/gold accents. */

:root {
  --navy: #1b2a4a;
  --navy-deep: #121d33;
  --gold: #f2b705;
  --bg: #f1f3f5;
  --card: #ffffff;
  --line: #dee2e6;
  --text: #212529;
  --muted: #6c757d;
}

* { box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  margin: 0; padding: 0;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 40px; }

.hero {
  background: linear-gradient(135deg, var(--navy-deep), var(--navy));
  color: #fff; border-radius: 0 0 12px 12px;
  padding: 28px 28px 24px; margin-bottom: 22px;
  border-bottom: 4px solid var(--gold);
}
.hero h1 { margin: 0; font-size: 30px; letter-spacing: .02em; }
.hero .sub { margin: 6px 0 0; color: #c9d2e0; font-size: 15px; }

.card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: 10px; padding: 20px 22px; margin-bottom: 18px;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.card h2 { margin: 0 0 14px; font-size: 18px; color: var(--navy); }
.card h2.mt { margin-top: 24px; }

.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
label { display: block; font-size: 13px; font-weight: 600; color: #495057; }
input[type=text], input[type=number], select {
  width: 100%; margin-top: 5px; padding: 9px 11px; font-size: 14px;
  border: 1px solid #ced4da; border-radius: 7px; background: #fff; color: var(--text);
}
input:focus, select:focus { outline: 2px solid #4dabf7; border-color: #4dabf7; }

.contractor { margin: 12px 0 0; font-size: 14px; }
.contractor .muted { color: var(--muted); }
.warn { color: #b54708; font-weight: 600; }

table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #e9ecef; }
thead th {
  background: var(--navy); color: #fff; font-size: 12px;
  text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
}
thead th:first-child { border-radius: 7px 0 0 0; }
thead th:last-child { border-radius: 0 7px 0 0; }
tfoot td { font-weight: 700; border-top: 2px solid var(--navy); border-bottom: none; }
.borings td input, .borings td select { margin-top: 0; }
.borings-scroll { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }

.rm {
  background: none; border: none; color: #c92a2a; font-size: 20px;
  cursor: pointer; line-height: 1; padding: 4px 10px; border-radius: 6px;
}
.rm:hover { background: #ffe3e3; }

.btn {
  display: inline-block; border: 1px solid #ced4da; background: #fff;
  border-radius: 7px; padding: 9px 18px; font-size: 14px; cursor: pointer;
  margin-top: 12px; font-weight: 600; color: var(--navy);
}
.btn.secondary:hover { background: #eef1f5; }

.totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.total-card {
  border: 1px solid var(--line); border-radius: 10px; padding: 16px 12px;
  text-align: center; background: linear-gradient(180deg, #f8f9fa, #fff);
  border-top: 4px solid var(--navy);
}
.total-card:nth-child(2) { border-top-color: #e8730c; }
.total-card:nth-child(3) { border-top-color: #5b7fa6; }
.total-card:nth-child(4) { border-top-color: var(--gold); }
.t-method { font-size: 13px; font-weight: 700; color: #495057; margin-bottom: 8px; }
.t-value { font-size: 26px; font-weight: 800; color: var(--navy-deep); }

.chart-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.chart-label { width: 110px; font-size: 13px; font-weight: 600; text-align: right; color: #495057; }
.chart-track { flex: 1; background: #e9ecef; border-radius: 5px; height: 28px; overflow: hidden; }
.chart-fill { height: 28px; border-radius: 5px; min-width: 2px; transition: width .3s; }
.chart-value { width: 115px; font-size: 14px; font-weight: 700; color: var(--navy-deep); }

.method-tables { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.method h3 { margin: 0 0 10px; font-size: 16px; color: var(--navy); }

footer { text-align: center; color: var(--muted); font-size: 13px; margin: 28px 0 10px; }

@media (max-width: 820px) {
  .grid4, .totals { grid-template-columns: 1fr 1fr; }
  .method-tables { grid-template-columns: 1fr; }
  .chart-label { width: 84px; }
  .borings { min-width: 560px; }
  .chart-value { width: 96px; font-size: 13px; }
}

/* Pay item description column in breakdown tables */
td.desc { font-size: 0.85em; color: #555; max-width: 320px; }

</style>
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1b2a4a">
</head>
<body>
<div class="wrap">

  <header class="hero">
    <div>
      <h1>DrillingCalc</h1>
      <p class="sub">Environmental drilling cost estimator</p>
    </div>
  </header>

  <section class="card" id="project">
    <h2>Project</h2>
    <div class="grid4">
      <label>Full days drilling
        <input type="number" id="in-days" min="0" step="1" value="4">
      </label>
      <label>ATC CID
        <select id="in-cid"></select>
      </label>
    </div>
    <p id="contractor-line" class="contractor"></p>
  </section>

  <section class="card">
    <h2>Boring log</h2>
    <div class="borings-scroll">
    <table class="borings">
      <thead>
        <tr><th>Location name</th><th>Type</th><th>6-in casing depth (ft)</th><th>Depth (ft)</th><th></th></tr>
      </thead>
      <tbody id="boring-body"></tbody>
    </table>
    </div>
    <button class="btn secondary" id="add-boring">+ Add boring</button>
  </section>

  <section class="card">
    <h2>Totals</h2>
    <div class="totals" id="totals"></div>
    <h2 class="mt">Cost comparison</h2>
    <div class="chart" id="chart"></div>
  </section>

  <section class="card">
    <h2>Cost breakdown by method</h2>
    <div class="method-tables" id="methods"></div>
  </section>

  <footer>
    Rates: FDEP Petroleum Restoration Program statewide ATC schedules (2025 contracts).
    Recreated from DrillingCalc.xlsx.
  </footer>
</div>
<script>
/* DrillingCalc — drilling cost estimator.
 *
 * Faithful recreation of DrillingCalc.xlsx ("Drilling Calculator" sheet).
 * All quantity rules are line-by-line translations of the workbook formulas:
 *  - the per-boring "Calculations" matrix (IF/AND depth-band logic)
 *  - the four method tables' Units rules (mob-distance and well-presence switches)
 *  - the rate lookup: REGION picks the sheet, ATC CID picks the contractor
 *    column, the pay item picks the row.
 *
 * The engine below is pure functions with no DOM access, so it can be
 * tested outside a browser (e.g. `node app.js` runs a self-test when the
 * rates file is available).
 */

"use strict";

/* ------------------------------------------------------------------ */
/* Pay items                                                           */
/* ------------------------------------------------------------------ */

// Per-boring quantity columns (the workbook's "Calculations" table).
const CALC_ITEMS = [
  "4-1.a.", "4-1.b.", "4-1.c.", "4-1.d.", "4-2.",
  "4-5.", "4-6.", "4-7.", "4-8.", "4-9.", "4-10.", "4-11.", "4-12.", "4-13.",
  "4-14.", "4-15.", "4-16.", "4-17.", "4-18.", "4-19.",
  "5-2.a.", "5-6.",
];

// Method tables: pay item + how Units are computed.
// units(ctx) where ctx = { fullDays, hasWell, maxDepth, sumCalc(name), boringCount }
// NOTE: the 2025 statewide schedule dropped mobilization distance bands,
// so the old <=100/>100-mile mob pairs collapse to single items.
const METHODS = [
  {
    name: "Hand Auger",
    items: [
      { item: "3-1.",  units: (c) => (c.boringCount > 0 && !c.hasWell && c.maxDepth <= 10) ? 1 : 0 },
      { item: "4-2.",  units: (c) => (!c.hasWell && c.maxDepth <= 10) ? c.sumCalc("4-2.") : 0 },
    ],
  },
  {
    name: "Direct Push",
    items: [
      { item: "3-1.",  units: (c) => c.boringCount > 0 ? 1 : 0 },
      { item: "3-4.",  units: (c) => (c.boringCount > 0 && !c.hasWell) ? 1 : 0 },
      { item: "3-5.",  units: (c) => (c.boringCount > 0 && c.hasWell) ? 1 : 0 },
      { item: "4-3.", units: (c) => c.boringCount > 0 ? c.fullDays : 0 },
      { item: "5-2.a.", units: (c) => c.sumCalc("5-2.a.") },
      { item: "5-6.",  units: (c) => c.sumCalc("5-6.") },
    ],
  },
  {
    name: "HSA",
    items: [
      { item: "3-1.",  units: (c) => c.boringCount > 0 ? 1 : 0 },
      { item: "3-5.",  units: (c) => c.boringCount > 0 ? 1 : 0 },
      { item: "4-1.a.", units: (c) => c.sumCalc("4-1.a.") },
      { item: "4-1.b.", units: (c) => c.sumCalc("4-1.b.") },
      { item: "4-1.c.", units: (c) => c.sumCalc("4-1.c.") },
      { item: "4-5.",  units: (c) => c.sumCalc("4-5.") },
      { item: "4-6.",  units: (c) => c.sumCalc("4-6.") },
      { item: "4-7.",  units: (c) => c.sumCalc("4-7.") },
      { item: "4-8.",  units: (c) => c.sumCalc("4-8.") },
      { item: "4-9.", units: (c) => c.sumCalc("4-9.") },
      { item: "4-10.", units: (c) => c.sumCalc("4-10.") },
      { item: "4-11.", units: (c) => c.sumCalc("4-11.") },
      { item: "4-12.", units: (c) => c.sumCalc("4-12.") },
      { item: "4-13.", units: (c) => c.sumCalc("4-13.") },
      { item: "5-2.a.", units: (c) => c.sumCalc("5-2.a.") },
      { item: "5-6.",  units: (c) => c.sumCalc("5-6.") },
    ],
  },
  {
    name: "Sonic",
    items: [
      { item: "3-1.",  units: (c) => c.boringCount > 0 ? 1 : 0 },
      { item: "3-5.",  units: (c) => c.boringCount > 0 ? 1 : 0 },
      { item: "4-1.d.", units: (c) => c.sumCalc("4-1.d.") },
      { item: "4-14.", units: (c) => c.sumCalc("4-14.") },
      { item: "4-15.", units: (c) => c.sumCalc("4-15.") },
      { item: "4-16.", units: (c) => c.sumCalc("4-16.") },
      { item: "4-17.", units: (c) => c.sumCalc("4-17.") },
      { item: "4-18.", units: (c) => c.sumCalc("4-18.") },
      { item: "4-19.", units: (c) => c.sumCalc("4-19.") },
      { item: "5-2.a.", units: (c) => c.sumCalc("5-2.a.") },
    ],
  },
];

/* ------------------------------------------------------------------ */
/* Quantity engine (translates the workbook's Calculations table)      */
/* ------------------------------------------------------------------ */

function ceilDiv(a, b) { return Math.ceil(a / b); }

/* Per-boring contributions. boring = { type, depth, casing }. */
function boringCalcs(b) {
  const T = (b.type || "").trim().toUpperCase();
  const D = Math.max(0, Number(b.depth) || 0);
  const C = Math.max(0, Number(b.casing) || 0);
  const isSB = T === "SB";
  const isMW = T === "MW";
  const isDW = T === "DW";
  const isWell = isMW || isDW;
  const out = {};
  out["4-1.a."] = (isSB && D < 50) ? ceilDiv(D, 2) : 0;
  out["4-1.b."] = (isSB && D >= 50 && D <= 100) ? ceilDiv(D, 2) : 0;
  out["4-1.c."] = (isSB && D > 100) ? ceilDiv(D, 2) : 0;
  out["4-1.d."]   = isSB ? Math.ceil(D / 10) : 0;
  out["4-2."]     = isSB ? 1 : 0;
  out["4-5."]  = (isDW && D < 50 && C > 0) ? D : 0;
  out["4-6."]  = (isDW && D >= 50 && D <= 100 && C > 0) ? D : 0;
  out["4-7."]  = (isDW && D > 100 && C > 0) ? D : 0;
  out["4-8."]  = ((isMW || isSB) && D < 50 && C === 0) ? D : 0;
  out["4-9."] = ((isMW || isSB) && D >= 50 && D <= 100 && C === 0) ? D : 0;
  out["4-10."] = ((isMW || isSB) && D > 100 && C === 0) ? D : 0;
  out["4-11."] = (isDW && D < 50 && C > 0) ? C : 0;
  out["4-12."] = (isDW && D >= 50 && D <= 100 && C > 0) ? C : 0;
  out["4-13."] = (isDW && D > 100 && C > 0) ? C : 0;
  out["4-14."] = (isSB && D < 50) ? D : 0;
  out["4-15."] = (isSB && D >= 50 && D <= 100) ? D : 0;
  out["4-16."] = (isSB && D > 100) ? D : 0;
  if (isWell && C < 50 && D < 50) out["4-17."] = C + D;
  else if (isWell && D >= 50 && C < 50) out["4-17."] = C;
  else out["4-17."] = 0;
  if (isWell && C >= 50 && C <= 100 && D >= 50 && D <= 100) out["4-18."] = C + D;
  else if (isWell && C < 50 && D >= 50 && D <= 100) out["4-18."] = D;
  else if (isWell && C >= 50 && C <= 100 && D > 100) out["4-18."] = C;
  else out["4-18."] = 0;
  if (isWell && C > 100 && D > 100) out["4-19."] = C + D;
  else if (isWell && C < 100 && D > 100) out["4-19."] = D;
  else out["4-19."] = 0;
  out["5-2.a."] = !isSB ? D : 0;
  out["5-6."]   = isDW ? C : 0;
  return out;
}

/* ------------------------------------------------------------------ */
/* Rate lookup (translates the VLOOKUP/SWITCH/XMATCH cost formula)      */
/* ------------------------------------------------------------------ */

// ratesData = parsed rates.json (statewide, no regions).
// Returns { gc, name, cost(item) } or an error.
function lookupContractor(ratesData, cid) {
  const cidStr = String(cid).trim();
  const c = (ratesData.contractors || []).find((x) => x.cid === cidStr);
  if (!c) return { error: "No contract found for CID " + cidStr };
  const table = (ratesData.rates || {})[c.gc] || {};
  return {
    gc: c.gc, name: c.name,
    cost: (item) => {
      const v = table[item.toLowerCase()];
      return (typeof v === "number") ? v : 0;
    },
  };
}

/* ------------------------------------------------------------------ */
/* Estimate                                                            */
/* ------------------------------------------------------------------ */


// Pay item descriptions (2025 statewide schedule) for the breakdown table.
const DESCRIPTIONS = {
  "3-1.": "Light Duty Vehicle (car or 1/2 ton truck) Mobilization",
  "3-4.": "DPT Rig and Support Vehicles Mobilization",
  "3-5.": "Drill Rig and Support Vehicles Mobilization (hollow stem auger, mud rotary or sonic)",
  "4-1.a.": "Split Spoon Sampling \u2013 2 foot (during boring) < 50 feet",
  "4-1.b.": "Split Spoon Sampling \u2013 2 foot (during boring) 50 to 100 feet",
  "4-1.c.": "Split Spoon Sampling \u2013 2 foot (during boring) > 100 feet",
  "4-1.d.": "Sonic Core Sampling - 5 or 10 foot (during boring)",
  "4-2.": "Hand Auger Boring <= 10 foot total depth",
  "4-3.": "Direct Push Technology (DPT) Rig and Equipment",
  "4-5.": "HSA or MR Boring, <= 6 inch diameter, < 50 foot total depth",
  "4-6.": "HSA or MR Boring, <= 6 inch diameter, 50 to 100 foot total depth",
  "4-7.": "HSA or MR Boring, <= 6 inch diameter, > 100 foot total depth",
  "4-8.": "HSA or MR Boring, > 6 to 10 inch diameter, < 50 foot total depth",
  "4-9.": "HSA or MR Boring, > 6 to 10 inch diameter, 50 to 100 foot total depth",
  "4-10.": "HSA or MR Boring, > 6 to 10 inch diameter, > 100 foot total depth",
  "4-11.": "HSA or MR Boring, > 10 to 14 inch diameter, < 50 foot total depth",
  "4-12.": "HSA or MR Boring, > 10 to 14 inch diameter, 50 to 100 foot total depth",
  "4-13.": "HSA or MR Boring, > 10 to 14 inch diameter, > 100 foot total depth",
  "4-14.": "Sonic Boring, <= 6 inch diameter, < 50 foot total depth",
  "4-15.": "Sonic Boring, <= 6 inch diameter, 50 to 100 foot total depth",
  "4-16.": "Sonic Boring, <= 6 inch diameter, > 100 foot total depth",
  "4-17.": "Sonic Boring, > 6 to 10 inch diameter, < 50 foot total depth",
  "4-18.": "Sonic Boring, > 6 to 10 inch diameter, 50 to 100 foot total depth",
  "4-19.": "Sonic Boring, > 6 to 10 inch diameter, > 100 foot total depth",
  "5-2.a.": "Well Installation - 2 inch diameter (vertical)",
  "5-6.": "Surface Casing - 6 inch diameter",
};

function calculate(project, borings, ratesData) {
  const fullDays = Math.max(0, Number(project.fullDays) || 0);

  const calcs = borings.map(boringCalcs);
  const sumCalc = (name) => calcs.reduce((s, c) => s + (c[name] || 0), 0);
  const hasWell = borings.some((b) => {
    const t = (b.type || "").trim().toUpperCase();
    return t.includes("MW") || t.includes("DW");
  });
  const maxDepth = borings.reduce((m, b) => Math.max(m, Number(b.depth) || 0), 0);

  const contract = lookupContractor(ratesData, project.cid);
  const boringCount = borings.filter((b) => (b.type || "").trim() !== "").length;
  const ctx = { fullDays, hasWell, maxDepth, sumCalc, boringCount };

  const methods = METHODS.map((m) => {
    const lines = m.items.map((it) => {
      const cost = contract.error ? 0 : contract.cost(it.item);
      const units = it.units(ctx);
      return { item: it.item, cost, units, total: cost * units };
    });
    const total = lines.reduce((s, l) => s + l.total, 0);
    return { name: m.name, lines, total };
  });

  return { methods, contract, boringCount };
}

/* ------------------------------------------------------------------ */
/* Browser UI                                                          */
/* ------------------------------------------------------------------ */

const fmt$ = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = (n) => Number(n.toFixed(2)).toLocaleString("en-US");

let RATES = null;
const state = {
  project: { fullDays: 4, cid: "" },
  borings: [
    { location: "1", type: "SB", casing: "", depth: 8 },
    { location: "2", type: "SB", casing: "", depth: 8 },
    { location: "3", type: "MW", casing: "", depth: 15 },
    { location: "4", type: "MW", casing: "", depth: 15 },
  ],
};

function el(id) { return document.getElementById(id); }

// Escape user-entered text before reflecting it into HTML attributes.
function escAttr(s) {
  return String(s ?? "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

function boringRowHtml(b, i) {
  return `<tr data-i="${i}">
    <td><input type="text" data-f="location" value="${escAttr(b.location)}" placeholder="name"></td>
    <td><select data-f="type">
      <option value=""></option>
      ${["SB", "MW", "DW"].map((t) => `<option ${b.type === t ? "selected" : ""}>${t}</option>`).join("")}
    </select></td>
    <td><input type="number" data-f="casing" min="0" step="any" value="${b.casing || ""}" placeholder="0"></td>
    <td><input type="number" data-f="depth" min="0" step="any" value="${b.depth || ""}" placeholder="0"></td>
    <td><button class="rm" data-rm="${i}" title="Remove">×</button></td>
  </tr>`;
}

function renderBorings() {
  el("boring-body").innerHTML = state.borings.map(boringRowHtml).join("");
}

function readBorings() {
  const rows = document.querySelectorAll("#boring-body tr");
  state.borings = [...rows].map((tr) => {
    const get = (f) => tr.querySelector(`[data-f="${f}"]`).value;
    return { location: get("location"), type: get("type"), casing: get("casing"), depth: get("depth") };
  });
}

function readProject() {
  state.project = {
    fullDays: el("in-days").value,
    cid: el("in-cid").value,
  };
}

function renderCidOptions() {
  const cs = RATES.contractors || [];
  const keep = cs.some((c) => c.cid === state.project.cid) ? state.project.cid : (cs[0] && cs[0].cid) || "";
  state.project.cid = keep;
  el("in-cid").innerHTML = cs.map((c) =>
    `<option value="${c.cid}" ${c.cid === keep ? "selected" : ""}>${c.cid} — ${c.gc} — ${c.name}</option>`).join("");
}

function render() {
  readProject();
  readBorings();
  const res = calculate(state.project, state.borings, RATES);

  // contractor line
  const cl = el("contractor-line");
  if (res.contract.error) {
    cl.innerHTML = `<span class="warn">${res.contract.error}</span>`;
  } else {
    cl.innerHTML = `Contract <b>${res.contract.gc}</b> — ${res.contract.name} <span class="muted">(CID ${state.project.cid}, statewide)</span>`;
  }

  // totals
  el("totals").innerHTML = res.methods.map((m) => `
    <div class="total-card">
      <div class="t-method">${m.name}</div>
      <div class="t-value">${fmt$(m.total)}</div>
    </div>`).join("");

  // chart
  const max = Math.max(...res.methods.map((m) => m.total), 1);
  const colors = { "Hand Auger": "#9aa3ad", "Direct Push": "#e8730c", "HSA": "#5b7fa6", "Sonic": "#f2b705" };
  el("chart").innerHTML = res.methods.map((m) => `
    <div class="chart-row">
      <div class="chart-label">${m.name}</div>
      <div class="chart-track"><div class="chart-fill" style="width:${(m.total / max * 100).toFixed(1)}%;background:${colors[m.name]}"></div></div>
      <div class="chart-value">${fmt$(m.total)}</div>
    </div>`).join("");

  // detail tables
  el("methods").innerHTML = res.methods.map((m) => `
    <div class="method">
      <h3>${m.name} — ${fmt$(m.total)}</h3>
      <table>
        <thead><tr><th>Pay Item</th><th>Description</th><th>Cost</th><th>Units</th><th>Total</th></tr></thead>
        <tbody>${m.lines.map((l) => `
          <tr><td>${l.item}</td><td class="desc">${DESCRIPTIONS[l.item] || ""}</td><td>${fmt$(l.cost)}</td><td>${fmtN(l.units)}</td><td>${fmt$(l.total)}</td></tr>`).join("")}
        </tbody>
        <tfoot><tr><td colspan="4">Total</td><td>${fmt$(m.total)}</td></tr></tfoot>
      </table>
    </div>`).join("");
}

function init() {
  // project inputs
  el("in-days").value = state.project.fullDays;
